spring.config.import=optional:file:./config/local.properties
# Ten ung dung
spring.application.name=linguacity-backend

# Cau hinh ket noi PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/linguacity_db
spring.datasource.username=postgres
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate - Tu dong tao va cap nhat bang SQL tu code Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true