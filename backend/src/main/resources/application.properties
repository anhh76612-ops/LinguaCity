spring.config.import=optional:file:./config/local.properties
# Ten ung dung
spring.application.name=linguacity-backend

# Cau hinh ket noi PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/linguacity_db
spring.datasource.username=postgres
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate - KHONG tu sua schema. Nguon su that la database/migration/V00N__*.sql
# (ddl-auto=update cua Hibernate 7 tu doi TEXT -> varchar(255), SMALLINT -> integer; xem adr/troubleshooting-log.md)
# Test dung H2 + create-drop rieng (xem cac lop *Tests).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ---------- Can bang game (system-design §10.6, GDD §4; BalanceProperties.java) ----------
# Tran Mastery theo do kho cua tu (ADR-013)
linguacity.balance.mastery-max.D=10
linguacity.balance.mastery-max.C=15
linguacity.balance.mastery-max.B=20
linguacity.balance.mastery-max.A=25
# Phien hoc (ADR-015 §1): 20 tu / 30 cau, het han sau 30 phut, bo tu vua on trong 10 phut
linguacity.balance.words-per-session=20
linguacity.balance.questions-per-session=30
linguacity.balance.session-ttl-minutes=30
linguacity.balance.review-cooldown-minutes=10
# KP cuoi phien = dung x 5 (+20 neu >= 80%); tu phien thu 6 trong ngay nhan 0.2 (chong cay)
linguacity.balance.kp-per-correct=5
linguacity.balance.kp-bonus-ratio=0.8
linguacity.balance.kp-bonus=20
linguacity.balance.kp-full-sessions-per-day=5
linguacity.balance.kp-reduced-multiplier=0.2
linguacity.balance.day-zone=Asia/Ho_Chi_Minh
# Bai kiem tra trinh do (ADR-014): 30 cau tu 20 tu, KP = dung x 3 + 100 qua chao mung
linguacity.balance.placement-words=20
linguacity.balance.placement-questions=30
linguacity.balance.placement-ttl-hours=24
linguacity.balance.placement-kp-per-correct=3
linguacity.balance.placement-welcome-kp=100
# TOP_ENTRANT: cao hon 90% khi da co >= 50 bai; chua du mau thi can >= 27/30
linguacity.balance.achievement-top-percent=90
linguacity.balance.achievement-min-samples=50
linguacity.balance.achievement-fallback-correct=27
# Luyen tap (ADR-015 §6): On 1 luot/ngay, Hon hop 3 luot/ngay, toi da 20 tu moi/ngay
linguacity.balance.practice-review-per-day=1
linguacity.balance.practice-mixed-per-day=3
linguacity.balance.practice-new-words-per-day=20
linguacity.balance.practice-kp-per-correct=3
linguacity.balance.practice-ttl-minutes=30
# Su kien thanh pho (ADR-015 §5): toi da 3/ngay, 5 cau, dung >= 4 thi +1 manh +15 KP
linguacity.balance.event-per-day=3
linguacity.balance.event-questions=5
linguacity.balance.event-pass-correct=4
linguacity.balance.event-reward-kp=15
linguacity.balance.event-reward-shards=1
linguacity.balance.event-min-collected=5
linguacity.balance.event-ttl-minutes=30
# Nhiem vu hang ngay (ADR-015 §4)
linguacity.balance.daily-quest-count=3

# ---------- Xac thuc (VS6, ADR-016; AuthProperties.java) ----------
# Bi mat ky JWT >= 32 byte, lay tu bien moi truong. De trong: server tu sinh khoa ngau nhien moi lan
# khoi dong (token cu mat hieu luc khi khoi dong lai) - chi dung cho dev/test.
linguacity.auth.jwt-secret=${LINGUACITY_JWT_SECRET:}
linguacity.auth.access-ttl-minutes=15
linguacity.auth.refresh-ttl-days=30
# Cho app ban cu gui header X-Guest-UUID (tat o VS7)
linguacity.auth.legacy-guest-header=true
# Khach da xong tutorial phai gan tai khoan moi choi tiep (403 ACCOUNT_REQUIRED)
linguacity.auth.require-account-after-tutorial=true
linguacity.auth.google-client-ids=${GOOGLE_WEB_CLIENT_ID:}
linguacity.auth.facebook-app-id=${FACEBOOK_APP_ID:}
linguacity.auth.facebook-app-secret=${FACEBOOK_APP_SECRET:}
linguacity.auth.mail-from=${LINGUACITY_MAIL_FROM:no-reply@linguacity.local}
linguacity.auth.otp-ttl-minutes=10
linguacity.auth.otp-max-attempts=5
linguacity.auth.otp-resend-seconds=60
linguacity.auth.login-max-per-email=5
linguacity.auth.login-max-per-ip=20
linguacity.auth.login-window-minutes=15

# SMTP gui OTP. De trong host: ma OTP chi ghi ra log (dev). Mailpit local: host=localhost, port=1025
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
