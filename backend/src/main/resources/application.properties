spring.config.import=optional:file:./config/local.properties
# Ten ung dung
spring.application.name=linguacity-backend

# Cau hinh ket noi PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/linguacity_db
spring.datasource.username=postgres
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate - KHONG tu sua schema. Nguon su that la database/migration/V00N__*.sql
# (ddl-auto=update cua Hibernate 7 tu doi TEXT -> varchar(255), SMALLINT -> integer; xem adr/troubleshooting-log.md)
# Test dung H2 + create-drop rieng (xem cac lop *Tests).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true